---
layout: info
title: Log In
lang: en-US
description: Log in to your IPL account.
permalink: /en-US/login/
---

<div class="min-h-[70vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-xl shadow-lg border p-8">
            <div class="text-center mb-8">
                <span
                    class="bg-blue-600 text-white w-12 h-12 rounded-lg flex items-center justify-center mx-auto text-xl font-bold mb-4">IP</span>
                <h1 class="text-2xl font-bold text-gray-900">Welcome Back</h1>
                <p class="text-gray-600">Log in to your IPL account</p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center">
                        <input type="checkbox" class="mr-2 rounded border-gray-300">
                        <span class="text-gray-600">Remember me</span>
                    </label>
                    <a href="/en-US/forgot-password/" class="text-blue-600 hover:underline">Forgot password?</a>
                </div>
                <button type="submit"
                    class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">
                    Log In
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                Don't have an account? <a href="/en-US/signup/" class="text-blue-600 hover:underline font-medium">Sign
                    up</a>
            </div>
        </div>
    </div>
</div>
