---
layout: default
title: Report Issues
lang: en-US
description: Report broken links, inaccurate information, or other issues with IPL resources.
permalink: /en-US/report-issues/
---

<div class="min-h-screen bg-gray-50 py-12">
    <div class="container mx-auto px-4">
        <div class="max-w-2xl mx-auto">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-bug text-orange-600 text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Report an Issue</h1>
                <p class="text-gray-600">Help us improve by reporting problems</p>
            </div>

            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-8">
                <form action="#" method="POST" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Issue Type</label>
                        <select
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option>Broken link</option>
                            <option>Inaccurate information</option>
                            <option>Outdated content</option>
                            <option>Inappropriate content</option>
                            <option>Technical problem</option>
                            <option>Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Page URL</label>
                        <input type="url" placeholder="https://ipl.better-web.org/..."
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea rows="4" placeholder="Describe the issue in detail..."
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Your Email (optional)</label>
                        <input type="email" placeholder="For follow-up questions"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit"
                        class="w-full py-3 bg-orange-600 text-white font-semibold rounded-lg hover:bg-orange-700 transition-colors">
                        Submit Report
                    </button>
                </form>
            </div>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">Or report directly on <a
                        href="https://github.com/InternetPublicLibrary/IPLibrary-website/issues/new"
                        class="text-blue-600 hover:underline">GitHub Issues</a></p>
            </div>
        </div>
    </div>
</div>
